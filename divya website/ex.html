<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       a:link{
            border: 2px solid rgb(250, 241, 241);
            width:120px;
            height: 60px;
            text-decoration: none;
            padding: 5px;
            margin-top: 50px;
            background-color:rgb(200, 247, 10);
            border-radius: 8px;
       }
     a:visited{
             border: 2px solid rgb(15, 15, 15);
            width:120px;
            height: 60px;
            text-decoration: none;
            padding: 5px;
            margin-top: 50px;
            background-color:orangered;
            border-radius: 8px;
        }
         a:active{
             border: 2px solid rgb(41, 225, 9);
            width:120px;
            height: 60px;
            text-decoration: none;
            padding: 5px;
            margin-top: 50px;
            background-color:rgb(247, 12, 133);
            border-radius: 8px;
        }
        a:hover{
             border: 2px solid rgb(232, 218, 218);
            width:120px;
            height: 60px;
            text-decoration: none;
            padding: 5px;
            margin-top: 50px;
            background-color:rgb(18, 238, 33);
            border-radius: 8px;
        }   
    </style>
</head>
<body>
<a href="./css.html">click now</a>
</body>
</html>
