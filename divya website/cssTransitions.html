<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <style>
        .box1{
            width:100px;
            height:80px;
            margin:20px; 
            display: block;
        }
        .box1:hover{
            width:300px;
            /* height:220px; */
            /* transition: transform 4s; */
            /* transform:rotateX(60deg); */
            transform: scale(1.5);
            /* transition:transform 3s ease-out; */
            /* transition: height 4s ease;  */
            /* transition:width 2s; */
        }
        .box2{
            width:100px;
            height:80px;
            margin:20px;
            /* transition: transform 3s linear; */
            /* transition: transform 2s ease; */
            /* transition: transform 3s ease-in; */
            /* transition: transform 3s ease-out; */
            /* transition: transform 3s ease-in-out; */
            /* transition: transform 3s cubic-bezier(0.455, 0.03, 0.515, 0.955); */
            
            display:block;
        }
        .box2:hover{
            
            transition: transform 3s cubic-bezier(.35,.61,.84,.32);
          transform: translateX(800px) translateY(350px) rotate(360deg) scale(1.5);
          /* transform: translateX(800px) translateX(350px) scale(2); */
          /* transform: scale(1.5); */
          /* transform: rotate(-120deg); */
            /* transition:transform 3s ease-out; */
            /* transition:transform 3s linear 1s ; */
            /* transition:transform 3s ease-in-out; */
            /* transition:transform 3s linear; */

        }
    </style>
</head>
<body>

     <!-- Transistions in css
     ==> it represents any change based on events or action like hovering the elements -->
     <!-- <div class="box"></div> -->
      
    <!--1.transition-property (Required)
        2.transition-duration (Required)
        3.transition-timing-function
        4.transition-delay 

        shorthand:
        transition: property timing timing_function delay;

       transition Timing functions:
       1. ease => specifies tranistion effect with a slow start then
                 fast, then end slowly [it is default property]
      2.linear => specifies transition effect with the same
                 speed from start to end
      3. ease-in => specifies tranistion effect with a slow start 
      4. ease-out => specifies tranistion effect with a slow end
      5.ease-in-out => specifies tranistion effect with a slow start and end
      6. cubic-bezier => let you define your own values in cubic-bezier function
                     [for further details , refer cubic-bezier website to adjust values]

        -->
        <div>
            <img src="imgs/download (5).jpg" alt="img1" class="box1">
        </div>
         <div>
        <img src="imgs/download (4).jpg" alt="img2" class="box2">
        </div> 
        <!---
        <div class="box3"></div>
        <div class="box4"></div> -->
</body>
</html>
