<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Necessary Dot</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================================
   PAGE
===================================================== */

body {
    margin: 0;

    background: #f5f3f0;

    overflow-x: hidden;

    color: #4b3000;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 3vw;

    border-bottom: 1px solid #d7d0c7;

    background: #f5f3f0;

}


.logo {

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size: 32px;

    color: #4b3000;

}


.subscribe {

    font-family: monospace;

    font-size: 15px;

    letter-spacing: 1px;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    position: relative;

    width: 100%;

    height: calc(100vh - 70px);

    min-height: 650px;

    overflow: hidden;

    background: #f5f3f0;

}


/* =====================================================
   TAGLINE
===================================================== */

.tagline {

    position: absolute;

    top: 10px;

    left: 0;

    width: 100%;

    text-align: center;

    z-index: 20;

    font-family: monospace;

    font-size: 16px;

    letter-spacing: 1px;

    color: #4b3000;

}


/* =====================================================
   FLOATING IMAGE AREA
===================================================== */

.image-area {

    position: absolute;

    left: 2%;

    top: 45px;

    width: 52%;

    height: 420px;

    z-index: 10;

    pointer-events: none;

}


/* =====================================================
   IMAGE WRAPPER
===================================================== */

.floating-image {

    position: absolute;

    width: 165px;

    padding: 10px;

    background: #ffffff;

    box-shadow:
        0 10px 30px rgba(70, 45, 10, 0.08);

    will-change: transform;

    pointer-events: auto;

    transform-origin: center center;

}


/* Image itself */

.floating-image img {

    display: block;

    width: 100%;

    height: 195px;

    object-fit: cover;

}


/* =====================================================
   IMAGE 1
   Upper-left
===================================================== */

.image-1 {

    left: 2%;

    top: 10px;

    transform:
        rotate(2deg);

}


/* =====================================================
   IMAGE 2
   Middle
===================================================== */

.image-2 {

    left: 30%;

    top: 65px;

    transform:
        rotate(-5deg);

}


/* =====================================================
   IMAGE 3
   Upper-right of cluster
===================================================== */

.image-3 {

    left: 58%;

    top: 15px;

    transform:
        rotate(4deg);

}


/* =====================================================
   FLOATING ANIMATION
===================================================== */

/*
   Each image gets a different animation.
   This makes them feel like separate floating
   objects instead of one group.
*/


.image-1 {

    animation:
        floatOne
        5.5s
        ease-in-out
        infinite;

}


.image-2 {

    animation:
        floatTwo
        6.5s
        ease-in-out
        infinite;

}


.image-3 {

    animation:
        floatThree
        5.8s
        ease-in-out
        infinite;

}


/* -----------------------------------------------------
   Image 1 floating
----------------------------------------------------- */

@keyframes floatOne {

    0%,
    100% {

        margin-top: 0;

    }

    50% {

        margin-top: -14px;

    }

}


/* -----------------------------------------------------
   Image 2 floating
----------------------------------------------------- */

@keyframes floatTwo {

    0%,
    100% {

        margin-top: 0;

    }

    50% {

        margin-top: 18px;

    }

}


/* -----------------------------------------------------
   Image 3 floating
----------------------------------------------------- */

@keyframes floatThree {

    0%,
    100% {

        margin-top: 0;

    }

    50% {

        margin-top: -11px;

    }

}


/* =====================================================
   COMING SOON
===================================================== */

.coming-soon {

    position: absolute;

    left: 1%;

    right: 1%;

    bottom: 25px;

    z-index: 5;

    text-align: center;

    font-family:
        "Bodoni 72",
        "Didot",
        "Times New Roman",
        serif;

    font-style: italic;

    font-size:
        clamp(
            90px,
            15vw,
            230px
        );

    font-weight: 500;

    line-height: 0.75;

    letter-spacing: -7px;

    color: #4b3000;

    white-space: nowrap;

    pointer-events: none;


    /* Initial blurred state */

    opacity: 0;

    filter: blur(28px);

    transform:
        scale(0.94);


    /* 3 SECOND REVEAL */

    animation:
        comingSoonReveal
        3s
        cubic-bezier(
            0.22,
            1,
            0.36,
            1
        )
        forwards;

}


/* =====================================================
   COMING SOON ANIMATION
===================================================== */

@keyframes comingSoonReveal {

    0% {

        opacity: 0;

        filter: blur(30px);

        transform:
            scale(0.94);

    }


    30% {

        opacity: 0.2;

        filter: blur(20px);

        transform:
            scale(0.97);

    }


    60% {

        opacity: 0.65;

        filter: blur(8px);

        transform:
            scale(0.99);

    }


    85% {

        opacity: 0.9;

        filter: blur(3px);

        transform:
            scale(1);

    }


    100% {

        opacity: 1;

        filter: blur(0);

        transform:
            scale(1);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .header {

        height: 60px;

    }


    .logo {

        font-size: 25px;

    }


    .subscribe {

        font-size: 12px;

    }


    .hero {

        min-height: 600px;

    }


    .tagline {

        font-size: 12px;

    }


    .image-area {

        left: 2%;

        top: 45px;

        width: 90%;

        height: 300px;

    }


    .floating-image {

        width: 105px;

        padding: 6px;

    }


    .floating-image img {

        height: 125px;

    }


    .image-1 {

        left: 0;

    }


    .image-2 {

        left: 30%;

        top: 60px;

    }


    .image-3 {

        left: 60%;

    }


    .coming-soon {

        bottom: 55px;

        font-size: 22vw;

        letter-spacing: -2px;

    }

}

</style>

</head>



<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">
        Necessary Dot
    </div>

    <div class="subscribe">
        Subscribe
    </div>

</header>



<!-- =====================================================
     HERO
===================================================== -->

<section
    class="hero"
    id="hero"
>


    <!-- TAGLINE -->

    <div class="tagline">
        A New Era of Beauty Is Near
    </div>



    <!-- =================================================
         FLOATING IMAGE CLUSTER
    ================================================== -->

    <div class="image-area">


        <!-- IMAGE 1 -->

        <div
            class="floating-image image-1"
            data-direction="-1"
            data-rotation="2"
            data-strength="1.2"
        >

            <img
                src="https://images.unsplash.com/photo-1616394584738-fc6e612e71b9?auto=format&fit=crop&w=600&q=80"
                alt="Beauty"
            >

        </div>



        <!-- IMAGE 2 -->

        <div
            class="floating-image image-2"
            data-direction="1"
            data-rotation="-5"
            data-strength="1.5"
        >

            <img
                src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=600&q=80"
                alt="Skincare"
            >

        </div>



        <!-- IMAGE 3 -->

        <div
            class="floating-image image-3"
            data-direction="-1"
            data-rotation="4"
            data-strength="1.3"
        >

            <img
                src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=600&q=80"
                alt="Beauty"
            >

        </div>

    </div>



    <!-- =================================================
         COMING SOON
    ================================================== -->

    <div class="coming-soon">

        Coming Soon.

    </div>


</section>


<!--******************************* Starting Javascript ***************************
+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
===============================================================================================
-->
<script>

/* =====================================================
   ELEMENTS
===================================================== */

const hero =
    document.getElementById("hero");

const images =
    document.querySelectorAll(
        ".floating-image"
    );



/* =====================================================
   MOUSE VALUES
===================================================== */

let mouseX = 0;

let mouseY = 0;

let targetX = 0;

let targetY = 0;



/* =====================================================
   MOUSE MOVE
===================================================== */

hero.addEventListener(
    "mousemove",
    function(event) {


        const rect =
            hero.getBoundingClientRect();


        /*
           Normalize cursor position.

           LEFT  = -1
           CENTER = 0
           RIGHT = +1

           TOP = -1
           CENTER = 0
           BOTTOM = +1
        */


        targetX =
            (
                (event.clientX - rect.left)
                /
                rect.width
                -
                0.5
            ) * 2;


        targetY =
            (
                (event.clientY - rect.top)
                /
                rect.height
                -
                0.5
            ) * 2;

    }
);



/* =====================================================
   MOUSE LEAVE
===================================================== */

hero.addEventListener(
    "mouseleave",
    function() {

        targetX = 0;

        targetY = 0;

    }
);



/* =====================================================
   SMOOTH MOUSE
===================================================== */

function animate() {


    /*
       Smoothly interpolate mouse movement.
       This prevents sudden/jittery movement.
    */

    mouseX +=
        (targetX - mouseX)
        * 0.08;


    mouseY +=
        (targetY - mouseY)
        * 0.08;



    /* =================================================
       EACH IMAGE
    ================================================= */

    images.forEach(
        function(image) {


            const direction =
                parseFloat(
                    image.dataset.direction
                );


            const strength =
                parseFloat(
                    image.dataset.strength
                );


            const rotation =
                parseFloat(
                    image.dataset.rotation
                );



            /* =========================================
               OPPOSITE HORIZONTAL SKEW
            ========================================= */


            const skewX =
                mouseX
                *
                9
                *
                strength
                *
                direction;



            /* =========================================
               OPPOSITE VERTICAL SKEW
            ========================================= */


            const skewY =
                mouseY
                *
                7
                *
                strength
                *
                direction;



            /* =========================================
               FLOATING MOVEMENT

               The movement is ALSO opposite,
               and alternates between images.
            ========================================= */


            const moveX =
                mouseX
                *
                14
                *
                strength
                *
                direction;


            const moveY =
                mouseY
                *
                10
                *
                strength
                *
                direction;



            /* =========================================
               SMALL ROTATION RESPONSE
            ========================================= */


            const mouseRotation =
                mouseX
                *
                3
                *
                direction;



            /* =========================================
               APPLY
            ========================================= */


            image.style.transform = `

                translate(
                    ${moveX}px,
                    ${moveY}px
                )

                rotate(
                    ${rotation + mouseRotation}deg
                )

                skew(
                    ${skewX}deg,
                    ${skewY}deg
                )

            `;

        }
    );



    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   START ANIMATION
===================================================== */

animate();

</script>


</body>
</html>
