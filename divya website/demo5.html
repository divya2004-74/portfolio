<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 150px;
            height: 150px;
            border: 2px solid red;
            background-color: fuchsia;
            margin: 40px;
            padding: 40px;
            transition: transform 3s ease-in-out ;
        }
        .box:hover{
          transform: rotate(180deg) ;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
