             .cont{

        img{
            display:block;
          /* Transform properties in css
          1.translate 
               translateX() --> rows
               translateY()--> column
               translateZ() --> depth of x and y coordinate
               translate() --> works for 2D (x,y) only
               translate3D() --> works for 3D (x,y,z)
          2.rotate
               rotate() --> give angles to rotate
               rotateX() --> for x-axis
               rotateY() --> for y-axis
               rotateZ() --> for z-axis
               rotate3d() --> for x,y,z axis along with same angle value
          3.scale
               scale --> to zoom or adjust width and height of the image/element
               scale() --> for x,y axis 
               scaleX()--> for x-axis
               scaleY()--> for y-axis
               scaleZ()--> for z-axis
               scale3d() --> for x,y,z axis along with same angle value
               4.skew
                skew--> to give a slant or angled appearance eg: tilting earth 
                skew()--> for x-axis and y-axis
               skewX()--> for x-axis
               skewY()--> for y-axis
              5.matrix
                 /* matrix--> shorthand property of above transform 
            syntax:  matrix(scaleX(), skewY(), skewX(), scaleY(), translateX(), translateY()) */
             
               
        }
