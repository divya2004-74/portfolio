<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* task1 complete transeform */
        body{
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            display: flex;
            flex-direction: row;
        }
        .box{
            width: 250px;
            height: 250px;
            border: 2px solid black;
            margin: 40px;
            padding: 20px;
            transition: transform 3s ease;
            background-color: red;
        }
        .box:hover{
            transform: rotate(45deg) scale(1.2);
        }

    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
