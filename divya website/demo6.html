<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball{
            width: 150px;
            height: 150px;
            border: 2px solid black;
            border-radius: 50%;
            background-color: darkorange;
            animation: myanime 3s infinite alternate;
        }
        @keyframes myanime{ 
       0%{
        background-color: aquamarine;
        transform: scale(1.5);
       }
       100%{
        background-color: blueviolet;
        transform: scale(0.5);
       }
        }
    </style>
</head>
<body>
 <div class="ball"></div>   
</body>
</html>
