<!DOCTYPE html>
<html lang="en">

<body>
    <script>
       
         let e=Number(prompt("enter a year"))
        // leap  year condition
        if((e%4===0 && e%100 !==0)||(e%400===0)){
            console.log(e+"is a leap year"); 
        }
        else{
            console.log(e+"is not a leap year");   
        }


    </script>
</body>
</html>
