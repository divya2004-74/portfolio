<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let a=Number(prompt("Enter a value  of a:"))
        let b=Number(prompt("Enter a value  of b:"))
        let c=Number(prompt("Enter a value  of c:"))
        if(a>=b && a>=c){
            console.log("a is the largest number")
        }
        // a should be greater than b and c
        else if(b>=a && b>=c){
            console.log("b is the largest number")
        }
        //  b should be greater than a and c
        else{
            console.log("c is the largest number")
        }
        // c should be greater than a and b
    </script>
</body>
</html>
