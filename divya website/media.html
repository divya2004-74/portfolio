<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
           border: 2px solid red;
           display:flex;
           flex-wrap:wrap;
           justify-content: space-between;
           align-items: center;
           gap: 40px;
        }
        .child{
            flex-basis: 25%;
            height: 150px;
            background-color:#bd1010;
            margin: 15px;
        }
        @media screen and  (max-width:1200px){
            .ch2{
              flex-basis:40%;
            height: 150px;
            background-color:#d7f419;
            margin: 15px;
            }
            .ch1{
                background-color: blue;
                  flex-basis:25%;
            height: 150px;
            margin: 15px;
            }
            .ch4{
                   background-color: rgb(20, 219, 20);
                  flex-basis:100%;
            height: 150px;
            margin: 15px;
            }
        }
         @media screen and  (max-width:950px){
            .c1{
                 flex-basis:25%;
            height: 150px;
            background-color:#bd1010;
            margin: 15px;
            }
            .c2{
                 flex-basis:100%;
            height: 150px;
            background-color:#0e6d68;
            margin: 15px;
            }
            .c3{
                  flex-basis:40%;
            height: 150px;
            background-color:#75ed1a;
            margin: 15px;
            }
        }

        @media screen and  (max-width:650px){
            .child1{
                 flex-basis:40%;
            height: 150px;
            background-color:#e95c0b;
            margin: 15px;
            }
            .child2{
                 flex-basis:40%;
            height: 150px;
            background-color:#18f138;
            margin: 15px;
            }
            .child3{
                  flex-basis:40%;
            height: 150px;
            background-color:#0f1cd9;
            margin: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child child1 ch2 c1"></div>
        <div class="child child1 ch2 c1"></div>
        <div class="child child2 ch1 c1"></div>
        <div class="child child2 ch1 c2"></div>
        <div class="child child3 ch1 c3"></div>
        <div class="child child3 ch4 c3" ></div>
    </div>
</body>
</html>
