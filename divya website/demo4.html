<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .badge{
            width: 150px;
            height: 40px;
            background-color: aquamarine;
            padding: 30px;
            margin: 30px;
            transition: transform 2s ease-in;
            border: 2ps solid red;
            border-radius: 15px;
        }
        .badge:hover{
           transform:skew(-15deg)
         translateX(20px); 
        }
    </style>
</head>
<body>
    <div class="badge"></div>
</body>
