<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript Music Player</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .player-container { width: 100%; max-width: 400px; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .now-playing { text-align: center; margin-bottom: 20px; }
        .now-playing h2 { margin: 10px 0 5px 0; font-size: 1.4rem; }
        .now-playing p { margin: 0; color: #b3b3b3; font-size: 0.9rem; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .btn { background: #1db954; border: none; color: white; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1ed760; transform: scale(1.05); }
        .btn-secondary { background: #333; }
        .btn-secondary:hover { background: #444; }
        .progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-size: 0.8rem; color: #b3b3b3; }
        .progress-bar { flex: 1; height: 6px; background: #444; border-radius: 3px; cursor: pointer; position: relative; }
        .progress-fill { width: 0%; height: 100%; background: #1db954; border-radius: 3px; }
        .playlist { border-top: 1px solid #333; padding-top: 15px; max-height: 200px; overflow-y: auto; }
        .track-item { padding: 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; font-size: 0.95rem; }
        .track-item:hover { background: #282828; }
        .track-item.active { background: #282828; color: #1db954; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-container">
    <!-- UI Component: Now Playing Display -->
    <div class="now-playing">
        <h2 id="trackTitle">Track Title</h2>
        <p id="trackArtist">Artist Name</p>
    </div>

    <!-- Hidden Native Audio Node -->
    <audio id="audioNode"></audio>

    <!-- UI Component: Custom Track Scrub/Progress Bar -->
    <div class="progress-container">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="setProgress(event)">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="totalDuration">0:00</span>
    </div>

    <!-- UI Component: Playback Buttons -->
    <div class="controls">
        <button class="btn btn-secondary" onclick="prevTrack()">Prev</button>
        <button class="btn" id="playBtn" onclick="togglePlay()">Play</button>
        <button class="btn btn-secondary" onclick="nextTrack()">Next</button>
    </div>

    <!-- UI Component: Playable Track List -->
    <div class="playlist" id="playlistContainer"></div>
</div>

<script>
// State Management / Data Layer
const playlist = [
    { title: "Lost in the City", artist: "Lo-Fi Beats", src: "https://soundhelix.com" },
    { title: "Summer Breeze", artist: "Acoustic Vibe", src: "https://soundhelix.com" },
    { title: "Neon Drive", artist: "Synthwave Express", src: "https://soundhelix.com" }
];

let currentTrackIndex = 0;
let isPlaying = false;

// DOM Element Selectors
const audio = document.getElementById('audioNode');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const playBtn = document.getElementById('playBtn');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalDurationEl = document.getElementById('totalDuration');
const playlistContainer = document.getElementById('playlistContainer');

// Core App Controller Logic
function initPlayer() {
    renderPlaylist();
    loadTrack(currentTrackIndex);
    
    // Audio Object Engine Listeners
    audio.addEventListener('timeupdate', updateProgressBar);
    audio.addEventListener('loadedmetadata', updateDurationDisplay);
    audio.addEventListener('ended', nextTrack); // Auto-advance playlist
}

function renderPlaylist() {
    playlistContainer.innerHTML = '';
    playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.classList.add('track-item');
        if (index === currentTrackIndex) item.classList.add('active');
        
        item.innerHTML = `<span>${track.title}</span><span style="color:#777;">${track.artist}</span>`;
        item.onclick = () => selectTrack(index);
        playlistContainer.appendChild(item);
    });
}

function loadTrack(index) {
    currentTrackIndex = index;
    const track = playlist[index];
    audio.src = track.src;
    trackTitle.innerText = track.title;
    trackArtist.innerText = track.artist;
    
    // Re-render UI list styles to move active state indicator
    document.querySelectorAll('.track-item').forEach((item, idx) => {
        item.classList.toggle('active', idx === currentTrackIndex);
    });
}

function togglePlay() {
    if (isPlaying) {
        audio.pause();
        playBtn.innerText = "Play";
    } else {
        audio.play().catch(e => console.log("User interaction required first"));
        playBtn.innerText = "Pause";
    }
    isPlaying = !isPlaying;
}

function selectTrack(index) {
    loadTrack(index);
    isPlaying = false;
    togglePlay(); // Force immediate play execution state on deliberate select
}

function nextTrack() {
    let nextIndex = currentTrackIndex + 1;
    if (nextIndex >= playlist.length) nextIndex = 0; // Wrap back to index 0
    selectTrack(nextIndex);
}

function prevTrack() {
    let prevIndex = currentTrackIndex - 1;
    if (prevIndex < 0) prevIndex = playlist.length - 1; // Wrap to tail end
    selectTrack(prevIndex);
}

// Timeline Progress Conversions
function updateProgressBar() {
    if (audio.duration) {
        const percentage = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percentage}%`;
        currentTimeEl.innerText = formatTime(audio.currentTime);
    }
}

function updateDurationDisplay() {
    totalDurationEl.innerText = formatTime(audio.duration);
}

function setProgress(event) {
    const width = progressBar.clientWidth;
    const clickX = event.offsetX;
    const duration = audio.duration;
    if (duration) {
        audio.currentTime = (clickX / width) * duration;
    }
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// Instantiate Execution Loop
initPlayer();
</script>

</body>
</html>
