<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=Number(prompt("Enter a first number:"))
        let condition=prompt("Symbol(+,-,*,/)")
        let b=Number(prompt("Enter a second number:"))
        if  (condition=="+"){
            result = a+b
        }
        else if(condition=="-"){
            result=a-b
        }
        else if(condition=="*"){
            result=a*b
        }
        else{
          result=a/b
        }

        console.log("result"+result)
    </script>
</body>
</html>
