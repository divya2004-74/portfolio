<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: pink;
            transition: transform 3s ease ;
            margin: 50px;
            width: 100px;
            height: 50px;
            border-radius: 20px;
            font-size: 15px;
            border: 2px solid black;
        }
        button:hover{
            transform: rotate(45deg) scale(1.5) translateY(40px);
        }
    </style>
</head>
<body>
    <button>click me</button>
</body>
</html>
