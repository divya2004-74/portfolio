        /* box1 animation */
        @keyframes anim {
            from {
                background-color: brown;
            }
            to{
                background-color: green;
            }
        }
        /* box2 animation  */
        @keyframes box-anim{
            0%{background-color: gold;left:20px;top:20px;}
            25%{background-color: aqua;left:220px;top:20px;}
            50%{background-color: orange;left:220px;top:220px;}
            75%{background-color: indigo;left:20px;top:220px;}
            100%{background-color: purple;left:20px;top:20px;}
        }
            

    </style>
 </head>
 <body>
    <!-- keyframes animations in css -->

     <!-- @keyframes - set of rules
      1.animation-name
      2.animation-delay
      3.animation-iteration-count
      4.animation-duration
      5.animation-direction
      6.animation-timing-function
      7.animation-fill-mode
      8.animation
     -->

     <!-- animation-direction:
      1.normal - animation played as normal(forwards) - it is default
      2.reverse -  animation played as reverse direction
      3.alternate -animation played forward first, then backwards
      4.alternate-reverse - animation played backward first, then forwards-->

      <!-- animation-timing-function:
       [similar to transition effect properties like
       ease,ease-in,ease-out.ease-in-out,linear,cubic bezier] 
       -->

      <!-- animation-fillmode:
       1.none - default value[no change]
       2.forwards- element will retain style values that is set by last keyframe
       [depends on animation-direction and animation-iteration-count]
       3.backwards -element will retain style values that is set by first keyframe 
       [depends on animation-direction and retains during animation-delay period]
       4.both- follows rules of backwards and forwards
       [extending animation properties in both direction]-->


       <!-- finally animation shorthand:
        animation: animation-name animation-duration animation-timing-function
                    animation-delay animation-iteration-count animation-direction
                    animation-fill-mode;-->


      <div class="box1"></div>
      <div class="box2"></div>
      <div class="box3"></div>
      <div class="box4"></div>
      <div class="shorthand"></div>
    
 </body>
