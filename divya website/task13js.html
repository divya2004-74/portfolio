<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name="Aarya"
        let m1=Number(prompt("enter a tamil mark"))
        let m2=Number(prompt("enter a english mark"))
        let m3=Number(prompt("enter a maths mark"))
        let m4=Number(prompt("enter a science mark"))
        let m5=Number(prompt("enter a social mark"))
        let total=m1+m2+m3+m4+m5
        let percentage=total/5
        console.log(percentage)
        if(percentage>=80){
            console.log(name+"grade-1")
        }
        else if(percentage>=60){
            console.log(name+"grade-2")
        }
        else{
            console.log(name+"grade-3")
        }
    </script>
</body>
</html>
